services:
  eval:
    image: spring-robolab:${ROBOLAB_TAG:-cloud}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ISAACLAB_TAG: ${ISAACLAB_TAG:-2.2.0}
    gpus: all
    network_mode: host
    ipc: host
    shm_size: 16gb
    environment:
      ACCEPT_EULA: "Y"
      OMNI_KIT_ACCEPT_EULA: "YES"
      NVIDIA_DRIVER_CAPABILITIES: all
      POLICY_VARIANT: ${POLICY_VARIANT:-pi05_compiled_regular}
      POLICY_HOST: ${POLICY_HOST:-}
      POLICY_PORT: ${POLICY_PORT:-8000}
      TASKS: ${TASKS:-BananaInBowlTask}
      NUM_ENVS: ${NUM_ENVS:-1}
      VIDEO_MODE: ${VIDEO_MODE:-none}
    volumes:
      - ../output:/workspace/robolab/output
      - isaac-cache:/root/.cache/ov
    entrypoint: ["/workspace/robolab/docker/run_cloud_eval.sh"]
    profiles: ["eval"]

  dashboard:
    image: spring-robolab:${ROBOLAB_TAG:-cloud}
    network_mode: host
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      OMNI_KIT_ACCEPT_EULA: "YES"
    volumes:
      - ../output:/workspace/robolab/output:ro
      - dashboard-config:/root/.config/robolab-dashboard
    entrypoint: ["/workspace/isaaclab/_isaac_sim/python.sh"]
    command:
      - -m
      - dashboard.cli
      - --output-dir
      - /workspace/robolab/output
      - --host
      - 0.0.0.0
      - --port
      - "8080"

volumes:
  isaac-cache:
  dashboard-config:
